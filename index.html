<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>AutoMinds Africa Bid Finder</title>
  <style>
    html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f7f8fa;color:#071d35;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{text-align:center;max-width:360px;padding:24px}.mark{width:46px;height:46px;margin:0 auto 15px;border-radius:14px;background:#071d35;display:grid;place-items:center;color:#ff7a0a;font-weight:900;box-shadow:0 12px 30px rgba(7,29,53,.12)}strong{display:block;font-size:16px}p{margin:7px 0 0;color:#718392;font-size:12px;line-height:1.6}.dots{margin:16px auto 0;display:flex;justify-content:center;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:#ff7a0a;animation:pulse 1.2s infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  </style>
  <script>setTimeout(function(){ window.location.reload(); }, 12000);</script>
</head>
<body>
  <div class="shell">
    <div class="mark">A</div>
    <strong>Opening AutoMinds Africa Bid Finder</strong>
    <p>The procurement workspace is being published. This page refreshes automatically and will open the full application as soon as deployment completes.</p>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
</body>
</html>
