name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.example.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify GitHub Pages export
        run: |
          test -f out/index.html
          test -f out/bids/index.html
          test -f out/grants/index.html
          test -f out/plans/index.html
          test -f out/bids/view/index.html
          test -f out/data/bids.json || echo "Live data is generated by the deployment collector; route export verified here."
          test -f out/data/plans.json || echo "Live procurement plans are generated by the deployment collector; route export verified here."

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Install Chromium for newspaper browser fallback
        run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - name: Prepare persistence fixture
        run: |
          mkdir -p ../public/data
          echo '[]' > ../public/data/previous-bids.json
      - name: Build live procurement discovery snapshot from 30-source network
        run: python -m src.export_30_source_snapshot
      - name: Merge procurement persistence
        run: python -m src.postprocess_snapshot
      - name: Build grants snapshot
        run: python -m src.export_grants
      - name: Validate separated persistent datasets
        run: |
          python - <<'PY'
          from datetime import datetime
          import json
          from pathlib import Path
          import re
          from zoneinfo import ZoneInfo

          bids = json.loads(Path("../public/data/bids.json").read_text(encoding="utf-8"))
          grants = json.loads(Path("../public/data/grants.json").read_text(encoding="utf-8"))
          plans = json.loads(Path("../public/data/plans.json").read_text(encoding="utf-8"))
          sources = json.loads(Path("../public/data/sources.json").read_text(encoding="utf-8"))
          assert bids, "live procurement snapshot is empty"
          assert isinstance(grants, list), "grants snapshot must be a list"
          assert plans, "current-financial-year procurement plans snapshot is empty"
          assert len({item.get("id") for item in sources}) == 30, f"expected 30 unique procurement sources, got {len(sources)}"

          kampala = ZoneInfo("Africa/Kampala")
          now = datetime.now(kampala)
          year = now.year if now.month >= 7 else now.year - 1
          expected_plan_fy = f"{year}-{year + 1}"
          html_pattern = re.compile(r"<\/?[a-z][^>]*>|&(?:nbsp|amp|lt|gt|quot|#\d+);", re.I)
          allowed_verification = {
              "verified",
              "source-unavailable",
              "not-seen-current-scan",
              "not-verified-current-scan",
          }

          for bid in bids:
              deadline_raw = bid.get("deadlineAt")
              assert deadline_raw, f"missing deadline: {bid.get('title')}"
              deadline = datetime.fromisoformat(deadline_raw.replace("Z", "+00:00")).astimezone(kampala)
              assert bid.get("opportunityType") == "tender", f"procurement record misclassified: {bid.get('title')}"
              assert bid.get("firstDetectedAt"), f"missing firstDetectedAt: {bid.get('title')}"
              assert bid.get("lastSeenAt"), f"missing lastSeenAt: {bid.get('title')}"
              assert bid.get("lastVerifiedAt"), f"missing lastVerifiedAt: {bid.get('title')}"
              assert bid.get("verificationStatus") in allowed_verification, f"invalid verificationStatus: {bid.get('verificationStatus')}"
              assert isinstance(bid.get("statusHistory"), list) and bid.get("statusHistory"), f"missing status history: {bid.get('title')}"
              if bid.get("status") == "open":
                  assert deadline >= now, f"open bid has passed deadline: {bid.get('title')}"
                  assert bid.get("isOpen") is True
              if bid.get("status") == "closed":
                  assert bid.get("isOpen") is False
              for field in ("title", "description", "organization"):
                  assert not html_pattern.search(bid.get(field, "")), f"raw HTML/entity in {field}: {bid.get(field, '')[:120]}"

          enriched_plan_count = 0
          category_count = 0
          for plan in plans:
              assert plan.get("id"), "procurement plan missing id"
              assert plan.get("organization"), "procurement plan missing organization"
              assert plan.get("financialYear") == expected_plan_fy, f"unexpected procurement-plan FY: {plan.get('financialYear')} != {expected_plan_fy}"
              assert plan.get("sourceUrl", "").startswith("https://egpuganda.go.ug/"), f"unexpected procurement-plan source URL: {plan.get('sourceUrl')}"
              assert not html_pattern.search(plan.get("organization", "")), f"raw HTML/entity in procurement-plan organization: {plan.get('organization', '')[:120]}"
              items = plan.get("items") or []
              if items:
                  enriched_plan_count += 1
              category_count += len(items)
              for item in items:
                  assert item.get("category"), f"procurement-plan category missing name: {plan.get('organization')}"
                  assert re.search(r"\d", item.get("estimatedAmountUGX", "")), f"procurement-plan category missing estimated UGX value: {item.get('category')}"
                  assert not html_pattern.search(item.get("category", "")), f"raw HTML/entity in procurement-plan category: {item.get('category', '')[:120]}"

          assert enriched_plan_count > 0, "no procurement plan detail pages produced category intelligence"
          assert category_count > 0, "procurement plans contain zero planned procurement categories"

          paper_sources = {item.get("name"): item for item in sources if item.get("name") in {"Daily Monitor", "New Vision"}}
          assert set(paper_sources) == {"Daily Monitor", "New Vision"}, "newspaper source health entries missing"
          for name, source in paper_sources.items():
              capture = source.get("captureStatus")
              assert capture, f"{name} missing captureStatus"
              assert source.get("collectorStatus"), f"{name} missing collectorStatus"
              assert "urlsDiscovered" in source, f"{name} missing discovery telemetry"
              if capture != "SUCCESS":
                  assert source.get("recordsFound") is None or source.get("recordsFound", 0) > 0, f"{name} incomplete capture incorrectly reported a genuine zero recordsFound"

          for grant in grants:
              assert grant.get("title"), "grant missing title"
              assert grant.get("sourceName"), "grant missing source"
              assert grant.get("sourceUrl"), "grant missing source URL"
              assert grant.get("status") in {"open", "forecasted", "closed"}, "invalid grant status"

          print(
              f"Validated 30-source network: {len(bids)} procurement bids; "
              f"{len(plans)} procurement plans / {category_count} planned categories; "
              f"{len(grants)} grant opportunities; {len(sources)} source monitors"
          )
          PY