name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.example.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify GitHub Pages export
        run: |
          test -f out/index.html
          test -f out/bids/index.html
          test -f out/bids/view/index.html
          test -f out/data/bids.json || echo "Live data is generated by the deployment collector; route export verified here."

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build live procurement snapshot
        run: python -m src.export_live_snapshot
      - name: Validate live snapshot quality
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          import json
          from pathlib import Path
          import re
          from zoneinfo import ZoneInfo

          path = Path("../public/data/bids.json")
          bids = json.loads(path.read_text(encoding="utf-8"))
          assert bids, "live snapshot is empty"

          kampala = ZoneInfo("Africa/Kampala")
          now = datetime.now(kampala)
          year = now.year if now.month >= 7 else now.year - 1
          fy_start = max(datetime(year, 7, 1, tzinfo=kampala), datetime(2026, 7, 1, tzinfo=kampala))
          latest = now + timedelta(days=90, hours=1)
          html_pattern = re.compile(r"<\/?[a-z][^>]*>|&(?:nbsp|amp|lt|gt|quot|#\d+);", re.I)

          for bid in bids:
              deadline_raw = bid.get("deadlineAt")
              assert deadline_raw, f"missing deadline: {bid.get('title')}"
              deadline = datetime.fromisoformat(deadline_raw.replace("Z", "+00:00")).astimezone(kampala)
              assert deadline >= fy_start, f"pre-FY deadline: {deadline_raw}"
              assert deadline <= latest, f"deadline beyond 90-day window: {deadline_raw}"
              published_raw = bid.get("publishedAt")
              if published_raw:
                  published = datetime.fromisoformat(published_raw.replace("Z", "+00:00")).astimezone(kampala)
                  assert published >= fy_start, f"pre-FY publication: {published_raw}"
              for field in ("title", "description", "organization"):
                  assert not html_pattern.search(bid.get(field, "")), f"raw HTML/entity in {field}: {bid.get(field, '')[:120]}"

          print(f"Validated {len(bids)} live opportunities: current FY, <=90 days, plain text only")
          PY
