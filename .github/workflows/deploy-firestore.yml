name: Deploy Firestore rules and indexes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/deploy-firestore.yml"

permissions:
  contents: read

concurrency:
  group: deploy-firestore
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      UNSAFE_SERVICE_ACCOUNT_VARIABLE: ${{ vars.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIRESTORE_DATABASE_ID: bidfinder-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment credential
        shell: bash
        run: |
          if [ -n "$UNSAFE_SERVICE_ACCOUNT_VARIABLE" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON must not be stored as an Environment variable. Delete it from Variables and recreate it using Add environment secret."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not configured as a github-pages environment secret."
            exit 1
          fi

      - name: Prepare temporary Google credential file
        shell: bash
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          PROJECT_ID=$(node -e 'const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON); process.stdout.write(c.project_id)')
          echo "FIREBASE_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Ensure Native-mode workspace database exists
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE="npx --yes firebase-tools@latest"

          if $FIREBASE firestore:databases:get "$FIRESTORE_DATABASE_ID" --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/workspace-db.json" 2>/dev/null; then
            echo "Firestore database $FIRESTORE_DATABASE_ID already exists."
          else
            echo "Creating Native-mode Firestore database $FIRESTORE_DATABASE_ID."
            $FIREBASE firestore:databases:get default --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/default-db.json"
            LOCATION=$(node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/default-db.json', 'utf8'));
          const value = raw.result || raw;
          const location = value.locationId || value.location_id || value.location || '';
          if (!location) process.exit(2);
          process.stdout.write(location);
          NODE
            )
            echo "Using existing Firestore location: $LOCATION"
            $FIREBASE firestore:databases:create "$FIRESTORE_DATABASE_ID" \
              --location="$LOCATION" \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive
          fi

      - name: Deploy rules and indexes to Native workspace database
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
