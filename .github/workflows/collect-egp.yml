name: Validate eGP Uganda source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collect-egp.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: validate-egp-uganda
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and normalize live procurement sources
        run: python -m src.export_live_snapshot

      - name: Verify live eGP coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sources = json.loads(Path("../public/data/sources.json").read_text(encoding="utf-8"))
          bids = json.loads(Path("../public/data/bids.json").read_text(encoding="utf-8"))

          egp = next((source for source in sources if source.get("id") == "egp-uganda"), None)
          assert egp is not None, "eGP Uganda source metadata was not generated"
          assert egp.get("health") == "healthy", f"eGP Uganda is not healthy: {egp.get('lastError', '')}"
          assert int(egp.get("recordsFound") or 0) > 0, "eGP Uganda returned zero normalized notices"

          egp_bids = [
              bid for bid in bids
              if any(source.get("id") == "egp-uganda" for source in bid.get("sources", []))
          ]
          assert egp_bids, "No eligible eGP Uganda opportunities were exported"

          print(f"eGP Uganda healthy: {egp['recordsFound']} parsed, {len(egp_bids)} eligible opportunities in the live search window")
          PY
