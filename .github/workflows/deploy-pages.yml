name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify web configuration
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in the github-pages environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt

      - name: Install Chromium for newspaper browser fallback
        run: python -m playwright install --with-deps chromium

      - name: Load persistent procurement history
        shell: bash
        run: |
          mkdir -p public/data
          git fetch --no-tags --depth=1 origin bid-persistence-state
          if git show FETCH_HEAD:persistence/bids.json > public/data/previous-bids.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("public/data/previous-bids.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(value, list):
              raise SystemExit("Persistent bid state was not a JSON list")
          print(f"Loaded {len(value)} persistent procurement records")
          PY
          else
            echo '[]' > public/data/previous-bids.json
            echo "Persistent state branch had no bid snapshot; starting from an empty history."
          fi

      - name: Export live procurement discovery snapshot
        run: python -m collector.src.export_live_snapshot

      - name: Merge discovery with persistent bid history
        run: python -m collector.src.postprocess_snapshot

      - name: Save persistent procurement history
        shell: bash
        run: |
          cp public/data/bids.json /tmp/persistent-bids.json
          rm -rf /tmp/bid-persistence-state
          git fetch --no-tags origin bid-persistence-state
          git worktree add --detach /tmp/bid-persistence-state origin/bid-persistence-state
          mkdir -p /tmp/bid-persistence-state/persistence
          cp /tmp/persistent-bids.json /tmp/bid-persistence-state/persistence/bids.json
          git -C /tmp/bid-persistence-state config user.name "github-actions[bot]"
          git -C /tmp/bid-persistence-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/bid-persistence-state add persistence/bids.json
          if git -C /tmp/bid-persistence-state diff --cached --quiet; then
            echo "Persistent procurement state is unchanged."
          else
            git -C /tmp/bid-persistence-state commit -m "Update persistent bid state [skip ci]"
            git -C /tmp/bid-persistence-state push origin HEAD:bid-persistence-state
          fi
          git worktree remove /tmp/bid-persistence-state --force

      - name: Remove persistence bootstrap from public artifact
        run: rm -f public/data/previous-bids.json

      - name: Export real grants snapshot
        run: python -m collector.src.export_grants

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
