name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIRESTORE_DATABASE_ID: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify web and persistence configuration
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in the github-pages environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt

      - name: Install Chromium for newspaper browser fallback
        run: python -m playwright install --with-deps chromium

      - name: Bootstrap from currently deployed procurement snapshot
        shell: bash
        run: |
          mkdir -p public/data
          if curl --fail --silent --show-error --location \
            "https://mdanson27.github.io/AUTOMINDS-AFRICA-BID-FINDER/data/bids.json" \
            --output public/data/previous-bids.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("public/data/previous-bids.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(value, list):
              raise SystemExit("Deployed bids snapshot was not a JSON list")
          print(f"Bootstrapped {len(value)} records from current Pages deployment")
          PY
          else
            echo '[]' > public/data/previous-bids.json
            echo "No deployed snapshot available; dedicated persistent store will be used."
          fi

      - name: Load persistent procurement history
        env:
          BID_PERSISTENCE_ACTION: load
        run: python -m collector.src.persistent_bid_store

      - name: Export live procurement discovery snapshot
        run: python -m collector.src.export_live_snapshot

      - name: Merge discovery with persistent bid history
        run: python -m collector.src.postprocess_snapshot

      - name: Save persistent procurement history
        env:
          BID_PERSISTENCE_ACTION: save
        run: python -m collector.src.persistent_bid_store

      - name: Remove persistence bootstrap from public artifact
        run: rm -f public/data/previous-bids.json

      - name: Export real grants snapshot
        run: python -m collector.src.export_grants

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
